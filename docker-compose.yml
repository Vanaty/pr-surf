services:
  pr-surf:
    build:
      context: .
    container_name: pr-surf
    working_dir: /app
    stdin_open: true
    tty: true
    environment:
      DISPLAY: :99
      LOG_LEVEL: INFO
      PAIR_TIMEOUT_S: 300
      CHROME_PROFILE_DIR: /app/chrome_profile
    ports:
      - "6080:6080"
      - "5900:5900"
    volumes:
      - ./chrome_profile:/app/chrome_profile
      - ./extensions:/app/extensions
